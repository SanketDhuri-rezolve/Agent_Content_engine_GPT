<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Movie Highlight Pipeline — Demo</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f8;
    --card-bg: #ffffff;
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --border: #e2e2e2;
    --accent: #4f46e5;
    --accent-text: #ffffff;
    --danger: #d33;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111113;
      --card-bg: #1b1b1e;
      --text: #f0f0f0;
      --muted: #9a9a9a;
      --border: #2e2e32;
      --accent: #818cf8;
      --accent-text: #111113;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 2rem 1rem 4rem;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
  .subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.25rem;
    margin-bottom: 1rem;
  }
  label { display: block; font-size: 0.85rem; color: var(--muted); margin: 0.75rem 0 0.25rem; }
  label:first-child { margin-top: 0; }
  input {
    width: 100%;
    padding: 0.5rem 0.6rem;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 0.9rem;
  }
  .row { display: flex; gap: 0.75rem; }
  .row > div { flex: 1; }
  button {
    margin-top: 1rem;
    padding: 0.55rem 1.2rem;
    border-radius: 6px;
    border: none;
    background: var(--accent);
    color: var(--accent-text);
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .status-line {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.9rem;
    color: var(--muted);
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted);
  }
  .dot.running { background: #e0a800; animation: pulse 1.2s infinite; }
  .dot.completed { background: #22a55e; }
  .dot.failed, .dot.error { background: var(--danger); }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  .highlight {
    border-left: 3px solid var(--accent);
    padding: 0.75rem 1rem;
    margin-bottom: 0.75rem;
    background: var(--card-bg);
    border-radius: 0 8px 8px 0;
    border-top: 1px solid var(--border);
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }
  .highlight-head {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 0.85rem; color: var(--muted); margin-bottom: 0.4rem;
  }
  .rank { font-weight: 700; color: var(--accent); }
  .highlight video {
    width: 100%;
    max-height: 260px;
    border-radius: 6px;
    margin-bottom: 0.5rem;
    background: #000;
  }
  .transcript { font-size: 0.95rem; line-height: 1.4; }
  .justification { font-size: 0.85rem; color: var(--muted); margin-top: 0.4rem; font-style: italic; }
  .moment-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 0.3rem; }
  .meta-row { font-size: 0.85rem; margin-top: 0.5rem; }
  .muted-inline { color: var(--muted); font-size: 0.8rem; }
  .dialogue-block { margin-top: 0.6rem; }
  .dialogue-line {
    border-left: 2px solid var(--border);
    padding-left: 0.6rem;
    margin-bottom: 0.5rem;
    font-size: 0.85rem;
  }
  .dialogue-text { font-style: italic; margin: 0.1rem 0; }
  .subtext { color: var(--muted); font-size: 0.78rem; }
  .details-block { margin-top: 0.6rem; font-size: 0.82rem; }
  .details-block summary { cursor: pointer; color: var(--accent); font-weight: 600; }
  .details-grid { margin-top: 0.5rem; display: flex; flex-direction: column; gap: 0.35rem; }
  .error-box {
    color: var(--danger); font-size: 0.85rem; margin-top: 0.5rem;
  }
  #resultsSection { margin-top: 1.5rem; display: none; }
  #resultsCount { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.75rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎬 Movie Highlight Pipeline</h1>
  <div class="subtitle">Submit a video, watch it process, see the ranked highlights.</div>

  <div class="card">
    <label for="videoFile">Upload a video file</label>
    <input id="videoFile" type="file" accept="video/*" onchange="uploadVideo()" />
    <div class="error-box" id="uploadError"></div>
    <div class="status-line" id="uploadStatus" style="display:none;"></div>

    <label for="videoUrl">…or a video URL / path</label>
    <input id="videoUrl" type="text" placeholder="https://example.com/movie.mp4" />

    <div class="row">
      <div>
        <label for="duration">Duration (seconds, optional)</label>
        <input id="duration" type="number" placeholder="auto-detect" />
      </div>
      <div>
        <label for="segmentCount">Segment count (optional)</label>
        <input id="segmentCount" type="number" placeholder="default" />
      </div>
      <div>
        <label for="slaTarget">SLA target (seconds, optional)</label>
        <input id="slaTarget" type="number" placeholder="240" />
      </div>
    </div>

    <button id="submitBtn" onclick="submitJob()">Submit Job</button>
    <div class="error-box" id="submitError"></div>
  </div>

  <div class="card" id="statusCard" style="display:none;">
    <div class="status-line">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">—</span>
    </div>
  </div>

  <div id="resultsSection">
    <div id="resultsCount"></div>
    <div id="resultsList"></div>
  </div>
</div>

<script>
  let pollTimer = null;

  function fmtTime(seconds) {
    const s = Math.floor(seconds % 60).toString().padStart(2, '0');
    const m = Math.floor(seconds / 60);
    return `${m}:${s}`;
  }

  async function uploadVideo() {
    const input = document.getElementById('videoFile');
    const errorBox = document.getElementById('uploadError');
    const statusLine = document.getElementById('uploadStatus');
    errorBox.textContent = '';
    if (!input.files || !input.files[0]) return;

    const formData = new FormData();
    formData.append('file', input.files[0]);

    statusLine.style.display = 'flex';
    statusLine.textContent = `Uploading ${input.files[0].name}…`;

    try {
      const res = await fetch('/uploads', { method: 'POST', body: formData });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.detail || `HTTP ${res.status}`);
      }
      const data = await res.json();
      document.getElementById('videoUrl').value = data.source_video_url;
      document.getElementById('duration').value = data.total_duration_seconds.toFixed(2);
      statusLine.textContent =
        `Uploaded — ${fmtTime(data.total_duration_seconds)} detected. Ready to submit.`;
    } catch (err) {
      errorBox.textContent = 'Upload failed: ' + err.message;
      statusLine.style.display = 'none';
    }
  }

  async function submitJob() {
    const videoUrl = document.getElementById('videoUrl').value.trim();
    const errorBox = document.getElementById('submitError');
    errorBox.textContent = '';
    if (!videoUrl) {
      errorBox.textContent = 'Enter a video URL or path first.';
      return;
    }

    const payload = { source_video_url: videoUrl };
    const duration = document.getElementById('duration').value;
    const segmentCount = document.getElementById('segmentCount').value;
    const slaTarget = document.getElementById('slaTarget').value;
    if (duration) payload.total_duration_seconds = parseFloat(duration);
    if (segmentCount) payload.segment_count = parseInt(segmentCount, 10);
    if (slaTarget) payload.sla_target_seconds = parseInt(slaTarget, 10);

    document.getElementById('submitBtn').disabled = true;
    document.getElementById('resultsSection').style.display = 'none';

    try {
      const res = await fetch('/jobs', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.detail || `HTTP ${res.status}`);
      }
      const job = await res.json();
      document.getElementById('statusCard').style.display = 'block';
      pollJob(job.id);
    } catch (err) {
      errorBox.textContent = 'Failed to submit: ' + err.message;
      document.getElementById('submitBtn').disabled = false;
    }
  }

  function setStatus(status, extra) {
    const dot = document.getElementById('statusDot');
    const text = document.getElementById('statusText');
    dot.className = 'dot ' + status;
    text.textContent = extra || `Status: ${status}`;
  }

  async function pollJob(jobId) {
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(async () => {
      try {
        const res = await fetch(`/jobs/${jobId}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const job = await res.json();
        setStatus(job.status, `Status: ${job.status} (${job.total_segments} segments)`);

        if (job.status === 'completed' || job.status === 'failed') {
          clearInterval(pollTimer);
          document.getElementById('submitBtn').disabled = false;
          if (job.status === 'completed') {
            await loadResults(jobId);
          }
        }
      } catch (err) {
        setStatus('error', 'Error polling job: ' + err.message);
        clearInterval(pollTimer);
        document.getElementById('submitBtn').disabled = false;
      }
    }, 2000);
  }

  // Converts a stored clip_url (file:///abs/path/.local_object_storage/
  // highlight_clips/<span_id>/<start>_<end>.mp4 — see
  // storage.object_storage.LocalFilesystemStorage.url_for) into the
  // web-playable path served by api/main.py's /clips static mount, which
  // is rooted at the same .local_object_storage directory. Returns null if
  // clip_url doesn't look like a local-storage path (e.g. a real S3/Azure
  // URL in a non-dev deployment, which is already directly playable as-is).
  function clipWebUrl(clipUrl) {
    if (!clipUrl) return null;
    const marker = '.local_object_storage/';
    const idx = clipUrl.indexOf(marker);
    if (idx === -1) return clipUrl.startsWith('file://') ? null : clipUrl;
    return '/clips/' + clipUrl.slice(idx + marker.length);
  }

  async function loadResults(jobId) {
    const res = await fetch(`/jobs/${jobId}/results`);
    if (!res.ok) return;
    const data = await res.json();
    const section = document.getElementById('resultsSection');
    const list = document.getElementById('resultsList');
    const count = document.getElementById('resultsCount');

    list.innerHTML = '';
    count.textContent = `${data.results.length} ranked highlight(s)`;

    for (const r of data.results) {
      const div = document.createElement('div');
      div.className = 'highlight';
      const videoUrl = clipWebUrl(r.clip_url);
      const rd = r.rich_data || {};

      const characters = (rd.characters_present || [])
        .map(c => `${escapeHtml(c.name)} <span class="muted-inline">(${escapeHtml(c.screen_percentage || '')})</span>`)
        .join(', ');

      const dialogue = (rd.dialogue_by_character || [])
        .map(d => `
          <div class="dialogue-line">
            <div><strong>${escapeHtml(d.name || '')}</strong> <span class="muted-inline">${escapeHtml(d.emotion || '')}</span></div>
            <div class="dialogue-text">"${escapeHtml(d.line || '')}"</div>
            ${d.subtext ? `<div class="subtext">subtext: ${escapeHtml(d.subtext)}</div>` : ''}
          </div>
        `).join('');

      const props = (rd.props_involved || []).map(escapeHtml).join(', ');
      const cine = rd.cinematography || {};
      const sound = rd.sound_design || {};
      const ad = rd.ad_placement || {};
      const risk = rd.risk_hints || {};
      const inv = rd.inversion_score || {};

      div.innerHTML = `
        <div class="highlight-head">
          <span><span class="rank">#${r.rank}</span> · ${fmtTime(r.start_ts)} – ${fmtTime(r.end_ts)}</span>
          <span>score: ${r.final_score.toFixed(3)}</span>
        </div>
        ${videoUrl ? `<video controls preload="metadata" src="${videoUrl}"></video>` : ''}
        ${rd.moment_title ? `<div class="moment-title">${escapeHtml(rd.moment_title)}</div>` : ''}
        <div class="transcript">${(rd.moment_description || r.transcript_excerpt) ? escapeHtml(rd.moment_description || r.transcript_excerpt) : '<em>(no transcript)</em>'}</div>
        ${r.justification ? `<div class="justification">${escapeHtml(r.justification)}</div>` : ''}
        ${characters ? `<div class="meta-row"><strong>Characters:</strong> ${characters}</div>` : ''}
        ${dialogue ? `<div class="dialogue-block">${dialogue}</div>` : ''}
        <details class="details-block">
          <summary>More details</summary>
          <div class="details-grid">
            ${props ? `<div><strong>Props:</strong> ${props}</div>` : ''}
            ${cine.shot_type ? `<div><strong>Shot:</strong> ${escapeHtml(cine.shot_type)} · ${escapeHtml(cine.camera_movement || '')} · ${escapeHtml(cine.lighting || '')}</div>` : ''}
            ${sound.sfx || (sound.bg_sound && sound.bg_sound.score) ? `<div><strong>Sound:</strong> ${escapeHtml(sound.sfx || '')} ${sound.bg_sound ? escapeHtml(sound.bg_sound.score || '') : ''}</div>` : ''}
            ${risk.risk_level ? `<div><strong>Risk:</strong> ${escapeHtml(risk.risk_level)} — ${escapeHtml(risk.description || '')}</div>` : ''}
            ${ad.is_suitable_ad_break !== undefined ? `<div><strong>Ad break suitable:</strong> ${ad.is_suitable_ad_break ? 'Yes' : 'No'} (score ${ad.suitability_score ?? '—'})</div>` : ''}
            ${inv.composite_score !== undefined ? `<div><strong>Impact:</strong> ${escapeHtml(inv.impact_tier || '')} (composite ${inv.composite_score})</div>` : ''}
            ${rd.moment_location ? `<div><strong>Location:</strong> ${escapeHtml(rd.moment_location)}</div>` : ''}
          </div>
        </details>
      `;
      list.appendChild(div);
    }
    section.style.display = 'block';
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
</script>
</body>
</html>
