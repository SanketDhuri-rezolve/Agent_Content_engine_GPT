[project]
name = "movie-highlight-pipeline"
version = "0.1.0"
description = "Horizontally-sharded movie highlight generation pipeline"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.30.0",
    "celery[redis]>=5.3.4",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "structlog>=24.1.0",
    "qdrant-client>=1.9.0",
    "boto3>=1.34.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Step 2+ only. Do NOT install these in Step 1 (no-GPU, zero-cost scaffold
# validation) — every workers/segment_worker/adapters/*.py Real* class defers
# these imports to inside its own __init__/methods specifically so this list
# is never required just to import the module, only to actually construct and
# run a Real* adapter (which only happens when its config.Settings.use_real_*
# flag is explicitly set — see workers/segment_worker/tasks.py).
gpu = [
    # ShotDetector -> TransNetV2. transnetv2-pytorch is an unofficial but
    # real, installable third-party PyTorch port (github.com/allenday/
    # transnetv2_pytorch) that bundles pretrained weights in the wheel — no
    # separate weights download needed for the stock model. Single-maintainer
    # package; pin conservatively and re-verify before a version bump.
    "transnetv2-pytorch>=1.0.5",
    # Transcriber -> faster-whisper large-v3-turbo.
    "faster-whisper>=1.1.0,<2",
    # Diarizer -> pyannote.audio. >=4.0 required (this repo's PyannoteDiarizer
    # uses the 4.0 `token=` kwarg, not the deprecated 3.x `use_auth_token=`).
    # 4.0.6 was yanked from PyPI — excluded explicitly.
    "pyannote.audio>=4.0.0,!=4.0.6",
    # Confirmed necessary on real GPU hardware: pyannote's default audio
    # reading path uses torchcodec, which failed to load its CUDA extension
    # on the test pod (libnvrtc.so.13 missing/version mismatch). Read WAV
    # files ourselves via soundfile (plain libsndfile, no CUDA dependency)
    # and hand pyannote a waveform tensor instead — see diarizer.py.
    "soundfile>=0.12.1",
    # VisualEmbedder -> InternVideo2 (OpenGVLab/InternVideo2-Stage2_6B via
    # transformers' AutoModel + trust_remote_code). flash-attn is a hard
    # dependency of the model's own remote code, not optional — it requires a
    # matching CUDA toolkit/ABI and is slow to build from source; install it
    # separately with `--no-build-isolation` if a plain `pip install .[gpu]`
    # fails on it (common flash-attn gotcha, not specific to this repo).
    # <5: confirmed on real GPU hardware that InternVideo2-Stage2_6B's own
    # remote modeling code (trust_remote_code=True) breaks on transformers 5.x
    # — it imports `apply_chunking_to_forward` from `transformers.modeling_utils`,
    # which transformers 5.13.1 no longer exposes there. Not caught in Step 2's
    # review since that was import/syntax-only, no GPU available — this is the
    # first real GPU run finding it.
    "transformers>=4.40,<5",
    "torch>=2.1",
    "pillow>=10.0",
    "einops>=0.7",
    "timm>=1.0",
    "flash-attn>=2.5",
    # huggingface_hub is already a transitive dep of transformers, but we now
    # call hf_hub_download directly (visual_embedder.py's config_bert_large.json
    # workaround), so it's a direct dependency too.
    "huggingface_hub>=0.34.0",
    # Confirmed needed on real GPU hardware: the pod environment had
    # HF_HUB_ENABLE_HF_TRANSFER=1 set (faster downloads) but this optional
    # package wasn't installed, which hard-fails instead of falling back to a
    # normal download.
    "hf_transfer>=0.1.4",
    # MotionFeatureExtractor -> OpenCV frame-diff. -headless: this runs
    # inside a Celery worker container with no display server.
    "opencv-python-headless>=4.9,<6",
    # AudioFeatureExtractor -> openSMILE (audEERING's official wrapper).
    # Pulls in audobject/audinterface/pandas transitively.
    "opensmile>=2.6.0",
    # FaceDetector -> MTCNN via facenet-pytorch. Only detects face bounding
    # boxes (see face_detector.py) — the face embeddings themselves reuse
    # ClipVisualEmbedder's already-loaded CLIP model, not a second model.
    "facenet-pytorch>=2.6.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Auto-discovers whichever of these packages actually exist in the build
# context, instead of a static list — each worker's Dockerfile only COPYs a
# subset (e.g. workers/scorer/Dockerfile never copies api/), and a static list
# hard-fails "pip install ." with "package directory 'api' does not exist"
# the moment any one entry is missing.
include = ["api*", "orchestrator*", "workers*", "models*", "storage*", "config*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
